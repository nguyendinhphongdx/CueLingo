[package]
name = "cuelingo-audio"
version = "0.0.0"
description = "CueLingo audio sidecar for Windows (same line protocol as native/macos-audio)"
edition = "2021"
publish = false

[lib]
name = "cuelingo_audio"
path = "src/lib.rs"

[[bin]]
name = "cuelingo-audio"
path = "src/main.rs"

[features]
# On-device recognition (Parakeet through sherpa-onnx, statically linked with its ONNX Runtime). Turn it off
# (`--no-default-features`) to build and test everything else without the native library download.
default = ["stt"]
stt = ["dep:sherpa-onnx"]

[dependencies]
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
uuid = { version = "1", features = ["v4"] }
sherpa-onnx = { version = "=2.0.1", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
strip = true
