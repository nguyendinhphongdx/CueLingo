# Local development dependencies for services/api and services/workers.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cuelingo
      POSTGRES_PASSWORD: cuelingo
      POSTGRES_DB: cuelingo
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
