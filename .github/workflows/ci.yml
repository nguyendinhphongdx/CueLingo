name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # format:check · lint · typecheck · test · check:deps (architecture rules)
      - run: pnpm verify
      # Real Postgres via Testcontainers (migrations, repositories, sign-in flow)
      - run: pnpm test:int
      # Next.js production build (webpack)
      - run: pnpm --filter @cuelingo/web build
      # The image must build and must not contain .env
      - run: docker build -f services/api/Dockerfile -t cuelingo-api:ci .
      - run: docker build -f services/workers/Dockerfile -t cuelingo-workers:ci .

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cuelingo_e2e
        ports: ['5544:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5544/cuelingo_e2e
      E2E_CHROME: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cuelingo/e2e exec playwright install --with-deps chromium
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5544/cuelingo_e2e?sslmode=disable
      # Web (Next dev server) and API start themselves; the journey signs in, reads a debrief, reviews, checks progress
      - run: pnpm --filter @cuelingo/e2e exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results

  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-macos
          workspaces: |
            apps/desktop/src-tauri -> target
      - run: pnpm --filter @cuelingo/desktop build
        working-directory: .
      # Tauri checks that the bundled sidecar exists; these steps only compile Rust, so a stand-in will do.
      - run: node scripts/sidecar.mjs --placeholder
        working-directory: apps/desktop
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  # Windows x64: lints and tests both Rust crates, measures the speech model on this runner (spike S2 of the
  # windows-desktop dossier: p50/p95 per sentence, memory, load time), builds the app and packs it with Inno Setup
  # into CueLingo-Windows-x64-setup.exe (ADR 0021), kept as a workflow artifact. WASAPI capture is not in this
  # build yet (ADR 0020). release.yml builds the same installer for a tag.
  desktop-windows:
    name: Desktop (Windows)
    # windows-2025 ships Inno Setup 6.7.1, the version installer/windows/Vietnamese.isl was taken from.
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-windows
          workspaces: |
            apps/desktop/native/windows-audio -> target
            apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
        working-directory: .

      # sherpa-onnx's build script downloads its static libraries (with their own ONNX Runtime) from GitHub.
      # Fetch them here instead, check the SHA-256, and hand them over through SHERPA_ONNX_ARCHIVE_DIR, so what
      # gets linked is exactly this file. Bump together with `sherpa-onnx` in native/windows-audio/Cargo.toml.
      - name: Cache the sherpa-onnx static libraries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sherpa-onnx
          key: sherpa-onnx-2.0.1-win-x64-static-MT-23e7b986
      - name: Fetch the pinned sherpa-onnx static libraries
        env:
          SHERPA_ARCHIVE: sherpa-onnx-v2.0.1-win-x64-static-MT-Release-lib.tar.bz2
          SHERPA_SHA256: 23e7b986b197eda0bbc47ff3d7d5c87afd6ef2b9077214ba26b0f1ec52ef0e66
        run: |
          dir="$RUNNER_TEMP/sherpa-onnx"
          mkdir -p "$dir"
          if [ ! -f "$dir/$SHERPA_ARCHIVE" ]; then
            curl -fsSL --retry 3 -o "$dir/$SHERPA_ARCHIVE" \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/$SHERPA_ARCHIVE"
          fi
          echo "$SHERPA_SHA256  $dir/$SHERPA_ARCHIVE" | sha256sum -c -
          echo "SHERPA_ONNX_ARCHIVE_DIR=$dir" >> "$GITHUB_ENV"

      - name: Lint and test the Windows sidecar
        working-directory: apps/desktop/native/windows-audio
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build the audio sidecar
        run: node scripts/sidecar.mjs --rebuild

      # Spike S2 (passed, see ADR 0020): run by hand with workflow_dispatch to measure again. The speech model is downloaded once (pinned revision and SHA-256, checked by the sidecar) and
      # kept between runs. The step prints p50/p95, memory and load time to the log and the job summary.
      - name: Cache the speech model
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cuelingo-models
          key: speech-model-${{ hashFiles('apps/desktop/native/windows-audio/src/stt/models.rs') }}
      - name: Measure speech recognition on this runner (S2)
        if: github.event_name == 'workflow_dispatch'
        env:
          CUELINGO_MODELS_DIR: ${{ runner.temp }}/cuelingo-models
        run: |
          node scripts/stt-bench.mjs --exe native/windows-audio/target/release/cuelingo-audio.exe
          # Again with 2 threads, as a stand-in for a weaker office laptop (the model is on disk now).
          node scripts/stt-bench.mjs --exe native/windows-audio/target/release/cuelingo-audio.exe --threads 2
          # And at the speed of a real meeting: partials every 0.7 s compete with the finals for the CPU.
          node scripts/stt-bench.mjs --exe native/windows-audio/target/release/cuelingo-audio.exe --realtime --runs 1

      - name: Build the app
        env:
          VITE_API_URL: ${{ vars.CUELINGO_API_URL }}
          VITE_WEB_URL: ${{ vars.CUELINGO_WEB_URL }}
          VITE_REALTIME_TOKEN: ''
        run: pnpm tauri build --no-bundle

      # After the build: the Rust crate embeds dist/, which the build step makes.
      - name: Lint and test the app core
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo test --locked

      - name: The bundle must not carry a development token
        run: |
          if grep -rIl "dev-token\|VITE_REALTIME_TOKEN=dev" dist; then
            echo "development token found in the built frontend" >&2
            exit 1
          fi

      - name: Pack the installer
        run: node scripts/windows-installer.mjs --out release-files

      - uses: actions/upload-artifact@v4
        with:
          name: CueLingo-Windows-x64-setup
          path: apps/desktop/release-files/CueLingo-Windows-x64-setup.exe
          if-no-files-found: error
