name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # format:check · lint · typecheck · test · check:deps (architecture rules)
      - run: pnpm verify
      # Docusaurus build fails on broken links
      - run: pnpm docs:build
      # Real Postgres via Testcontainers (migrations, repositories, sign-in flow)
      - run: pnpm test:int
      # Next.js production build (webpack)
      - run: pnpm --filter @cuelingo/web build
      # The image must build and must not contain .env
      - run: docker build -f services/api/Dockerfile -t cuelingo-api:ci .
      - run: docker build -f services/workers/Dockerfile -t cuelingo-workers:ci .

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cuelingo_e2e
        ports: ['5544:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5544/cuelingo_e2e
      E2E_CHROME: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cuelingo/e2e exec playwright install --with-deps chromium
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5544/cuelingo_e2e?sslmode=disable
      # Web (Next dev server) and API start themselves; the journey signs in, reads a debrief, reviews, checks progress
      - run: pnpm --filter @cuelingo/e2e exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results

  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm --filter @cuelingo/desktop build
        working-directory: .
      # Tauri checks that the bundled sidecar exists; these steps only compile Rust, so a stand-in will do.
      - run: node scripts/sidecar.mjs --placeholder
        working-directory: apps/desktop
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
