name: Web (Cloudflare Pages)

# The web app (apps/web) exported as static files and published to Cloudflare Pages.
# A pull request only builds and scans the export; a push to main (or a manual run) also deploys.
# Needs, in the repository settings:
#   secrets   CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages - Edit), CLOUDFLARE_ACCOUNT_ID
#   variables CUELINGO_WEB_PROJECT (the Pages project name), CUELINGO_API_URL (public https API address)
#   optional  CUELINGO_DOWNLOAD_URL, CUELINGO_GOOGLE_ENABLED, CUELINGO_SANDBOX_ORIGIN, CUELINGO_AGENT_HTML_BLOCKS
# Setup steps: apps/docs/docs/04-modules/02-web/deploy-cloudflare.md
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/shared/**'
      - 'packages/core-sdk/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-cloudflare.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/shared/**'
      - 'packages/core-sdk/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-cloudflare.yml'
  workflow_dispatch:

# The job only reads this repository; it writes to Cloudflare with the API token.
permissions:
  contents: read

concurrency:
  group: web-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      # Written into the files at build time (NEXT_PUBLIC_*). Until the API is online the variable may be unset:
      # the placeholder is a name that never resolves, so every screen that needs the API says it cannot connect.
      NEXT_PUBLIC_API_URL: ${{ vars.CUELINGO_API_URL || 'https://api.invalid' }}
      NEXT_PUBLIC_DOWNLOAD_URL: ${{ vars.CUELINGO_DOWNLOAD_URL }}
      NEXT_PUBLIC_GOOGLE_ENABLED: ${{ vars.CUELINGO_GOOGLE_ENABLED }}
      NEXT_PUBLIC_SANDBOX_ORIGIN: ${{ vars.CUELINGO_SANDBOX_ORIGIN }}
      NEXT_PUBLIC_AGENT_HTML_BLOCKS: ${{ vars.CUELINGO_AGENT_HTML_BLOCKS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      # CI=true: without it pnpm may stop to ask for confirmation.
      - run: CI=true pnpm install --frozen-lockfile

      - name: Say so when the API address is not set yet
        if: ${{ vars.CUELINGO_API_URL == '' }}
        run: echo "::warning::CUELINGO_API_URL is not set; the site is built without an API and will report that it cannot connect."

      # Fails when a required NEXT_PUBLIC variable is missing or points at a development address.
      - name: Build the static export
        run: pnpm --filter @cuelingo/web build:static

      - name: Pages and the Cloudflare files must exist
        run: |
          for f in index.html login.html download.html sessions/_.html assistant/_.html 404.html _headers _redirects; do
            test -f "apps/web/out/$f" || { echo "missing apps/web/out/$f" >&2; exit 1; }
          done

      # The export must not carry a key, a token, a development address, or the Cloudflare credentials themselves.
      - name: The export must not carry secrets or development addresses
        env:
          FORBIDDEN_STRINGS: |
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
            ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @cuelingo/web scan:static

      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CUELINGO_WEB_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "secret CLOUDFLARE_API_TOKEN is not set" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "secret CLOUDFLARE_ACCOUNT_ID is not set" >&2; exit 1; }
          if ! printf '%s' "$PROJECT" | grep -Eq '^[a-z0-9][a-z0-9-]{0,57}$'; then
            echo "CUELINGO_WEB_PROJECT is not set (or not a Pages project name)" >&2
            exit 1
          fi
          # `pages deploy` does not create a missing project, so create it first. An existing project is fine.
          if pnpm dlx wrangler@4.158.0 pages project list 2>/dev/null | grep -Fq " ${PROJECT} "; then
            echo "Pages project ${PROJECT} exists"
          else
            pnpm dlx wrangler@4.158.0 pages project create "$PROJECT" --production-branch main
          fi
          pnpm dlx wrangler@4.158.0 pages deploy apps/web/out \
            --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
