name: Pages

# Public intro and install page (apps/site). Static: no API, no sign-in, no secrets.
# This repository is private and its plan has no Pages, so the built site is pushed to the `gh-pages`
# branch of the public releases repository, where GitHub Pages serves it. The download button points at
# the latest .dmg of that same repository (ADR 0017).
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# The job only reads this repository; it writes to the releases repository with RELEASES_TOKEN.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The URL is built only when the repository variable is set and looks like owner/name, so an unset
      # variable stops the job instead of publishing a link to nowhere.
      - name: Work out the download link and the base path
        env:
          RELEASES_REPO: ${{ vars.CUELINGO_RELEASES_REPO }}
        run: |
          if ! printf '%s' "$RELEASES_REPO" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "CUELINGO_RELEASES_REPO is not set (or not owner/name)" >&2
            exit 1
          fi
          echo "VITE_DOWNLOAD_URL=https://github.com/${RELEASES_REPO}/releases/latest/download/CueLingo-macOS-arm64.dmg" >> "$GITHUB_ENV"
          # A project site lives at /<repository name>/ unless that repository is <user>.github.io.
          name="${RELEASES_REPO#*/}"
          case "$name" in
            *.github.io) echo "SITE_BASE=/" >> "$GITHUB_ENV" ;;
            *) echo "SITE_BASE=/${name}/" >> "$GITHUB_ENV" ;;
          esac

      - name: Build the site
        run: pnpm --filter @cuelingo/site build

      - name: Both pages must exist
        run: |
          test -f apps/site/dist/index.html
          test -f apps/site/dist/download/index.html

      # AC7: the public build must not carry a token, a key, a development host or a private address.
      - name: The built site must not carry secrets, development tokens or API addresses
        env:
          FORBIDDEN_STRINGS: |
            ${{ vars.CUELINGO_API_URL }}
            ${{ vars.CUELINGO_WEB_URL }}
        run: node apps/site/scripts/scan-dist.mjs apps/site/dist

      # Replaces the whole branch with one commit, so the history does not grow with every build.
      - name: Publish to the gh-pages branch of the releases repository
        env:
          RELEASES_REPO: ${{ vars.CUELINGO_RELEASES_REPO }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          test -n "$RELEASES_TOKEN"
          touch apps/site/dist/.nojekyll
          cd apps/site/dist
          git init -q -b gh-pages
          git config user.name "cuelingo-pages"
          git config user.email "pages@users.noreply.github.com"
          git add -A
          git commit -qm "Publish site from ${GITHUB_SHA}"
          auth=$(printf 'x-access-token:%s' "$RELEASES_TOKEN" | base64 -w0)
          echo "::add-mask::${auth}"
          git -c "http.extraheader=Authorization: Basic ${auth}" \
            push --force "https://github.com/${RELEASES_REPO}.git" gh-pages
