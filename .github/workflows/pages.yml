name: Pages

# Public intro and install page (apps/site). Static: no API, no sign-in, no secrets.
# Served by GitHub Pages of this repository (Settings → Pages → Source: GitHub Actions). The download
# button points at the latest .dmg released by release.yml in this same repository (ADR 0017).
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Work out the download link and the base path
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "VITE_DOWNLOAD_URL=https://github.com/${REPO}/releases/latest/download/CueLingo-macOS-arm64.dmg" >> "$GITHUB_ENV"
          # A project site lives at /<repository name>/ unless that repository is <user>.github.io.
          name="${REPO#*/}"
          case "$name" in
            *.github.io) echo "SITE_BASE=/" >> "$GITHUB_ENV" ;;
            *) echo "SITE_BASE=/${name}/" >> "$GITHUB_ENV" ;;
          esac

      - name: Build the site
        run: pnpm --filter @cuelingo/site build

      - name: Both pages must exist
        run: |
          test -f apps/site/dist/index.html
          test -f apps/site/dist/download/index.html

      # AC7: the public build must not carry a token, a key, a development host or a private address.
      - name: The built site must not carry secrets, development tokens or API addresses
        env:
          FORBIDDEN_STRINGS: |
            ${{ vars.CUELINGO_API_URL }}
            ${{ vars.CUELINGO_WEB_URL }}
        run: node apps/site/scripts/scan-dist.mjs apps/site/dist

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
