name: Pages

# Public intro and install page (apps/site) on GitHub Pages. Static: no API, no sign-in, no secrets.
# The download button points at the latest .dmg of the releases repository (ADR 0017).
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages needs only these; nothing here can write to the code.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      # base_path is "/<repository name>" for a project site and empty for a <user>.github.io repository.
      - name: Read the Pages settings
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - run: pnpm install --frozen-lockfile

      # The URL is built only when the repository variable is set and looks like owner/name, so an unset
      # variable gives a locked "Sắp có bản tải" button instead of a link to nowhere (AC3).
      - name: Work out the download link
        env:
          RELEASES_REPO: ${{ vars.CUELINGO_RELEASES_REPO }}
        run: |
          if printf '%s' "$RELEASES_REPO" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "VITE_DOWNLOAD_URL=https://github.com/${{ vars.CUELINGO_RELEASES_REPO }}/releases/latest/download/CueLingo-macOS-arm64.dmg" >> "$GITHUB_ENV"
          else
            echo "::warning::CUELINGO_RELEASES_REPO is not set (or not owner/name): the download button will be locked."
            echo "VITE_DOWNLOAD_URL=" >> "$GITHUB_ENV"
          fi

      - name: Build the site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm --filter @cuelingo/site build

      - name: Both pages must exist
        run: |
          test -f apps/site/dist/index.html
          test -f apps/site/dist/download/index.html

      # AC7: the public build must not carry a token, a key, a development host or a private address.
      - name: The built site must not carry secrets, development tokens or API addresses
        env:
          FORBIDDEN_STRINGS: |
            ${{ vars.CUELINGO_API_URL }}
            ${{ vars.CUELINGO_WEB_URL }}
        run: node apps/site/scripts/scan-dist.mjs apps/site/dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
